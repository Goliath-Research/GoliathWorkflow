project:
  type: book
  output-dir: _book

book:
  title: "MethylPipeline: Theory, Workflows, and Reference"
  output-file: "MethylPipeline Theory - Implementation - Usage"
  subtitle: "Mathematical foundations, operational workflows, and complete configuration reference"
  author: "MethylPipeline Team"
  date: last-modified
  chapters:
    - index.qmd
    - part: "Part I: Mathematical and Statistical Foundations"
      chapters:
        - chapters/01-methylutils.qmd
        - chapters/02-methylcentroid.qmd
        - chapters/03-methyldetector.qmd
        - chapters/04-methylclassifier.qmd
        - chapters/05-methylpredictor-and-validation.qmd
        - chapters/07-methylmapper.qmd
        - chapters/08-methylenricher.qmd
        - chapters/09-methylalignmentqc.qmd
        - chapters/09a-methylextractionqc.qmd
        - chapters/10-limitations-and-open-questions.qmd
    - part: "Part II: Workflows and Production"
      chapters:
        - chapters/11-project-configuration.qmd
        - chapters/12-two-workflows.qmd
    - part: "Part III: Configuration Reference"
      chapters:
        - chapters/13-configuration-reference.qmd
    - part: "Part IV: User Guide"
      chapters:
        - chapters/14-user-guide.qmd
    - part: "Part V: Model Training and Validation"
      chapters:
        - chapters/15-model-creation-and-validation.qmd
bibliography: references.bib
link-citations: true

crossref:
  eq-prefix: Eq.
  fig-prefix: Fig.
  tbl-prefix: Tbl.
  sec-prefix: §

format:
  html:
    theme: cosmo
    toc: true
    number-sections: true
    code-overflow: wrap
    html-math-method: mathjax
  pdf:
    documentclass: scrreprt
    toc: true
    number-sections: true
    colorlinks: true
    pdf-engine: lualatex
    include-in-header:
      text: |
        \usepackage{amsmath,amssymb,mathtools}
        \usepackage{microtype}
        \usepackage{tikz}
        \usetikzlibrary{arrows.meta,positioning,calc,fit}
    geometry:
      - margin=1in

execute:
  enabled: false
