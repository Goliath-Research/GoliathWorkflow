project:
  type: book
  output-dir: _book

book:
  title: "MethylPipeline: Mathematical and Statistical Foundations"
  subtitle: "A code-backed theory reference"
  author: "MethylPipeline Team"
  date: last-modified
  chapters:
    - index.qmd
    - chapters/01-methylutils.qmd
    - chapters/02-methylcentroid.qmd
    - chapters/03-methyldetector.qmd
    - chapters/04-methylclassifier.qmd
    - chapters/05-methylpredictor-and-validation.qmd
    - chapters/06-methylcluster.qmd
    - chapters/07-methylmapper.qmd
    - chapters/08-methylenricher.qmd
    - chapters/09-methylalignmentqc.qmd
    - chapters/10-limitations-and-open-questions.qmd
  appendices:
    - README.md

bibliography: references.bib
link-citations: true

crossref:
  eq-prefix: Eq.
  fig-prefix: Fig.
  tbl-prefix: Tbl.

format:
  html:
    theme: cosmo
    toc: true
    number-sections: true
    code-overflow: wrap
    html-math-method: mathjax
  pdf:
    documentclass: scrreprt
    toc: true
    number-sections: true
    colorlinks: true
    pdf-engine: pdflatex
    geometry:
      - margin=1in

execute:
  enabled: false
