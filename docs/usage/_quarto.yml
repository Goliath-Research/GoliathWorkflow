project:
  type: book
  output-dir: _book

book:
  title: "MethylPipeline Usage Manual"
  output-file: "MethylPipeline Usage Manual"
  subtitle: "Operational runbook for DomainProgram workflows and staged validation"
  author: "MethylPipeline Team"
  date: last-modified
  chapters:
    - index.qmd
    - 00-relationship-to-theory-and-implementation.qmd
    - part: "Part I: Setup and Package Orientation"
      chapters:
        - 01-prerequisites-and-environment.qmd
        - 02-project-config-and-layout.qmd
        - 03-sample-prep-and-qc.qmd
        - 04-orchestration-workflow-run.qmd
        - 04-package-reference-individual-usage.qmd
    - part: "Part II: Staged Solution Workflow"
      chapters:
        - 05-stage-stability.qmd
        - 06-stage-freeze.qmd
        - 07-stage-model.qmd
        - 08-stage-post-model-validation.qmd
        - 09-stage-blind-prediction.qmd
    - part: "Part III: Operations and Reliability"
      chapters:
        - 10-artifacts-and-qa-checks.qmd
        - 11-troubleshooting-and-recovery.qmd
        - 12-command-cookbook.qmd
        - 13-distributed-methyl-validation.qmd
        - 14-deployment-and-distributed-workflow.qmd
        - 15-optional-hyperparameter-search.qmd
    - part: "Part IV: Worked Tutorials"
      chapters:
        - 16-tutorial-healthy-vs-cancer-stages.qmd
    - part: "Part V: Hyperparameter Versioning"
      chapters:
        - 17-content-addressed-action-store.qmd

format:
  html:
    theme: cosmo
    toc: true
    number-sections: true
    code-overflow: wrap
  pdf:
    documentclass: scrreprt
    classoption:
      - DIV=12
    toc: true
    number-sections: true
    colorlinks: true
    pdf-engine: lualatex
    include-in-header:
      text: |
        \usepackage{graphicx}
        \input{pdf-table-fix.tex}
    geometry:
      - margin=1in

execute:
  enabled: false
