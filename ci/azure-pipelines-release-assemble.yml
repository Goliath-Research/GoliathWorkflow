# Assemble epimethyl worker release bundle from independent MethylPipeline + MethylExtractor versions.
# Manual trigger only. Publishes epimethyl-release-<releaseVersion> pipeline artifact for deploy.

trigger: none

parameters:
  - name: releaseVersion
    displayName: Deploy bundle version (SemVer)
    type: string
  - name: methylPipelineVersion
    displayName: MethylPipeline artifact version
    type: string
  - name: methylExtractorVersion
    displayName: MethylExtractor Universal Package version
    type: string
  - name: methylPipelinePipelineName
    displayName: ADO pipeline name for MethylPipeline release
    type: string
    default: MethylPipeline-Release

variables:
  azureDevOpsOrg: https://dev.azure.com/EpiMethyl

pool:
  vmImage: ubuntu-latest

steps:
  - checkout: self

  - task: DownloadPipelineArtifact@2
    displayName: Download MethylPipeline release artifact
    inputs:
      buildType: specific
      project: $(System.TeamProject)
      definition: ${{ parameters.methylPipelinePipelineName }}
      buildVersionToDownload: latestFromBranch
      branchName: refs/tags/v${{ parameters.methylPipelineVersion }}
      artifactName: methyl-pipeline-release-${{ parameters.methylPipelineVersion }}
      targetPath: $(Pipeline.Workspace)/mp-release

  - bash: |
      set -euo pipefail
      az extension add --name azure-devops 2>/dev/null || az extension update --name azure-devops
      export AZURE_DEVOPS_EXT_PAT="$(System.AccessToken)"
      az devops configure --defaults organization=$(azureDevOpsOrg) project=$(System.TeamProject)
      chmod +x scripts/assemble_release.sh scripts/download_methyl_extractor_artifacts.sh
      bash scripts/assemble_release.sh \
        --release-version "${{ parameters.releaseVersion }}" \
        --methyl-pipeline-version "${{ parameters.methylPipelineVersion }}" \
        --methyl-extractor-version "${{ parameters.methylExtractorVersion }}" \
        --methyl-pipeline-dir "$(Pipeline.Workspace)/mp-release" \
        --output "$(Build.ArtifactStagingDirectory)/epimethyl-release"
    displayName: Assemble release bundle
    env:
      SYSTEM_ACCESSTOKEN: $(System.AccessToken)

  - task: PublishPipelineArtifact@1
    inputs:
      targetPath: $(Build.ArtifactStagingDirectory)/epimethyl-release
      artifactName: epimethyl-release-${{ parameters.releaseVersion }}
    displayName: Publish epimethyl release bundle
