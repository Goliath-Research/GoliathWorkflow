# SamplePrep real-data canary (self-hosted GPU; on-demand / scheduled).
#
# Distinct from:
#   - azure-pipelines-pr.yml          (hosted unit/catalog; no /work, no GPU)
#   - azure-pipelines-smoke.yml       (WORKER_STUB_EXTERNAL=1 graph smoke)
#   - azure-pipelines-real-data.yml   (pytest -m real_data on extracted H5)
#
# This pipeline runs FASTQ → align → QC → extract for one pinned public WGBS
# sample across linear, stock Giraffe (engineering comparator), and methylGrapher.
#
# Azure DevOps: New pipeline -> this repo -> /ci/azure-pipelines-sample-prep-canary.yml
# Suggested name: MethylPipeline-SamplePrep-Canary

trigger: none
pr: none

schedules:
  - cron: "0 6 1 * *"
    displayName: Monthly subset canary (1st of month 06:00 UTC)
    branches:
      include:
        - main
    always: true

parameters:
  - name: tier
    displayName: Data tier
    type: string
    default: subset
    values:
      - subset
      - full
  - name: modes
    displayName: Alignment modes (space-separated)
    type: string
    default: "linear pangenome pangenome_wgbs"
  - name: siteConfig
    displayName: Site manifest path (METHYL_SITE_CONFIG)
    type: string
    default: /work/site/methyl_site.json
  - name: canaryConfig
    displayName: Optional METHYL_SAMPLE_PREP_CANARY_CONFIG path
    type: string
    default: ""
  - name: timeoutSeconds
    displayName: Per-mode timeout seconds
    type: number
    default: 14400
  - name: allowMissingChecksums
    displayName: Allow missing SHA-256 pins (debug only)
    type: boolean
    default: false

pool:
  name: production-work-agents

steps:
  - script: |
      set -euo pipefail
      if [[ ! -d .venv ]]; then
        python -m venv .venv
      fi
      . .venv/bin/activate
      python -m pip install -U pip
      bash scripts/install_packages.sh --with-deps
    displayName: Ensure test venv

  - script: |
      set -euo pipefail
      . .venv/bin/activate
      unset WORKER_STUB_EXTERNAL || true
      export METHYL_SITE_CONFIG="${{ parameters.siteConfig }}"
      if [[ -n "${{ parameters.canaryConfig }}" ]]; then
        export METHYL_SAMPLE_PREP_CANARY_CONFIG="${{ parameters.canaryConfig }}"
      fi
      REPORT_DIR="$(pwd)/test-results/sample-prep-canary"
      mkdir -p "$REPORT_DIR"
      EXTRA=()
      if [[ "${{ parameters.allowMissingChecksums }}" == "True" ]]; then
        EXTRA+=(--allow-missing-checksums)
      fi
      # shellcheck disable=SC2086
      bash scripts/smoke_sample_prep_real.sh \
        --tier "${{ parameters.tier }}" \
        --modes ${{ parameters.modes }} \
        --timeout "${{ parameters.timeoutSeconds }}" \
        --report-dir "$REPORT_DIR" \
        --run-root "$(pwd)/.smoke/sample_prep_canary" \
        "${EXTRA[@]}"
    displayName: SamplePrep real canary (${{ parameters.tier }})
    env:
      BACKEND_DB: $(BACKEND_DB)
      AZURE_SQL_SERVER: $(AZURE_SQL_SERVER)
      AZURE_SQL_DB: $(AZURE_SQL_DB)
      AZURE_SQL_USER: $(AZURE_SQL_USER)
      AZURE_SQL_PASSWORD: $(AZURE_SQL_PASSWORD)
      POSTGRES_HOST: $(POSTGRES_HOST)
      POSTGRES_DB: $(POSTGRES_DB)
      POSTGRES_USER: $(POSTGRES_USER)
      POSTGRES_PASSWORD: $(POSTGRES_PASSWORD)
      METHYL_METHYLGRAPHER_IMAGE: $(METHYL_METHYLGRAPHER_IMAGE)

  - task: PublishTestResults@2
    condition: always()
    inputs:
      testResultsFormat: JUnit
      testResultsFiles: test-results/sample-prep-canary/*.junit.xml
      testRunTitle: MethylPipeline SamplePrep real canary
      failTaskOnFailedTests: true
    displayName: Publish canary JUnit

  - task: PublishPipelineArtifact@1
    condition: always()
    inputs:
      targetPath: test-results/sample-prep-canary
      artifact: sample-prep-canary-${{ parameters.tier }}
    displayName: Publish qualification reports
