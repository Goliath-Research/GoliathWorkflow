# MethylPipeline production release — tag v* (SemVer e.g. v2026.6.1)
# Builds wheels, runtime-bundle; publishes to PyPI feed + pipeline artifact.
#
# Azure DevOps: New pipeline → this repo → /ci/azure-pipelines-release.yml

trigger:
  tags:
    include:
      - v*

pool:
  vmImage: ubuntu-latest

variables:
  EPIMETHYL_ROOT: /work/epimethyl
  PYTHON_VERSION: "3.12"
  # TwineAuthenticate artifactFeed: ProjectName/FeedName; twine -r uses feed name only
  pypiFeed: Development/pypi-epimethyl
  pypiFeedName: pypi-epimethyl

steps:
  - task: UsePythonVersion@0
    inputs:
      versionSpec: $(PYTHON_VERSION)

  - script: |
      python -m pip install -U pip build wheel pip-tools twine
    displayName: Install build tools

  - bash: |
      set -euo pipefail
      VERSION="${BUILD_SOURCEBRANCHNAME#v}"
      echo "##vso[task.setvariable variable=ReleaseVersion]$VERSION"
      bash scripts/build_release.sh \
        --version "$VERSION" \
        --output "$(Build.ArtifactStagingDirectory)/release" \
        --with-gpu-reqs
    displayName: Build release (wheels + runtime-bundle + manifest)

  - task: PublishPipelineArtifact@1
    inputs:
      targetPath: $(Build.ArtifactStagingDirectory)/release
      artifactName: methyl-pipeline-release-$(ReleaseVersion)
    displayName: Publish release artifact

  - task: TwineAuthenticate@1
    inputs:
      artifactFeed: $(pypiFeed)
    displayName: Authenticate to PyPI feed

  - bash: |
      set -euo pipefail
      twine upload --non-interactive \
        --config-file "$(PYPIRC_PATH)" \
        --repository "$(pypiFeedName)" \
        "$(Build.ArtifactStagingDirectory)/release/wheels/"*.whl
    displayName: Upload wheels to Azure Artifacts PyPI feed

  # Optional: copy to shared /work when a self-hosted agent with EPIMETHYL_ROOT is used
  - bash: |
      set -euo pipefail
      DEST="$(EPIMETHYL_ROOT)/releases/$(ReleaseVersion)"
      sudo mkdir -p "$DEST"
      sudo rsync -rl --no-perms --no-owner --no-group \
        "$(Build.ArtifactStagingDirectory)/release/" "$DEST/"
      echo "Published to $DEST"
    displayName: Copy to shared storage (/work/epimethyl)
    condition: and(succeeded(), eq(variables['Agent.OS'], 'Linux'))
    continueOnError: true
