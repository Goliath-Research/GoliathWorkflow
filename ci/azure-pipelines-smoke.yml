# Nightly / post-deploy distributed workflow smoke (stub worker).
# Requires production-work-agents pool with gateway + PostgreSQL wf schema.
#
# Azure DevOps: New pipeline → /ci/azure-pipelines-smoke.yml

trigger: none

schedules:
  - cron: "0 6 * * *"
    displayName: Nightly distributed workflow smoke
    branches:
      include:
        - main
    always: true

parameters:
  - name: apiBase
    displayName: Gateway API base
    type: string
    default: http://localhost:8080/v1

pool:
  name: production-work-agents

variables:
  PYTHON_VERSION: "3.12"

stages:
  - stage: Smoke
    displayName: Gateway workflow smoke
    jobs:
      - job: DistributedSmoke
        displayName: Sample prep + study lifecycle smoke
        steps:
          - checkout: self

          - task: UsePythonVersion@0
            inputs:
              versionSpec: $(PYTHON_VERSION)

          - script: |
              python -m venv .venv
              . .venv/bin/activate
              python -m pip install -U pip
              bash scripts/install_packages.sh --with-deps
            displayName: Build test venv

          - script: |
              set -euo pipefail
              . .venv/bin/activate
              export WORKER_STUB_EXTERNAL=1
              export WORKER_API_BASE="${{ parameters.apiBase }}"
              bash scripts/smoke_sample_prep.sh --api-base "$WORKER_API_BASE"
              bash scripts/smoke_study_lifecycle.sh --api-base "$WORKER_API_BASE"
            displayName: Run sample prep and study lifecycle smoke
