# Real reference-sample tests (self-hosted; requires /work mounted).
#
# Runs the `real_data`-marked tests against designated real reference samples
# (per-analyte samples + named groups) declared in the site manifest `testing`
# block or a METHYL_TEST_DATA_CONFIG registry. Hosted PR agents do not mount
# /work, so these tests live here rather than in azure-pipelines-pr.yml.
#
# Azure DevOps: New pipeline -> this repo -> /ci/azure-pipelines-real-data.yml.
# Suggested name: MethylPipeline-RealData. Trigger manually or on a schedule.

trigger: none
pr: none

parameters:
  - name: testDataConfig
    displayName: Optional path to a test-data registry JSON (overrides site 'testing' block)
    type: string
    default: ""
  - name: siteConfig
    displayName: Site manifest path (METHYL_SITE_CONFIG)
    type: string
    default: /work/site/methyl_site.json

pool:
  name: production-work-agents

steps:
  - script: |
      set -euo pipefail
      python -m venv .venv
      . .venv/bin/activate
      python -m pip install -U pip pytest pytest-cov
      bash scripts/install_packages.sh --with-deps
    displayName: Build test venv (editable packages + deps)

  - script: |
      set -euo pipefail
      . .venv/bin/activate
      export METHYL_SITE_CONFIG="${{ parameters.siteConfig }}"
      if [[ -n "${{ parameters.testDataConfig }}" ]]; then
        export METHYL_TEST_DATA_CONFIG="${{ parameters.testDataConfig }}"
      fi
      # Only the real_data-marked tests; they self-skip if a sample is absent.
      python -m pytest -m real_data \
        --junitxml=test-results/real-data-junit.xml \
        -rs -v
    displayName: Real reference-sample tests (-m real_data)

  - task: PublishTestResults@2
    condition: succeededOrFailed()
    inputs:
      testResultsFormat: JUnit
      testResultsFiles: test-results/real-data-junit.xml
      testRunTitle: MethylPipeline real reference-sample tests
      failTaskOnFailedTests: true
    displayName: Publish real-data test results
