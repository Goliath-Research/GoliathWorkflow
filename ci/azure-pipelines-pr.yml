# MethylPipeline PR validation — tests + release packaging smoke (no publish)
#
# Azure DevOps: New pipeline → this repo → /ci/azure-pipelines-pr.yml

trigger: none

pr:
  branches:
    include:
      - main
      - master
      - develop

pool:
  vmImage: ubuntu-latest

variables:
  PYTHON_VERSION: "3.12"

steps:
  - task: UsePythonVersion@0
    inputs:
      versionSpec: $(PYTHON_VERSION)

  - script: |
      python -m pip install -U pip pytest pytest-cov
    displayName: Install pytest

  - script: |
      bash scripts/check_doc_links.sh
    displayName: Documentation link guard

  - script: |
      python scripts/check_windows_paths.py
      pytest scripts/tests/test_check_windows_paths.py -q
    displayName: Windows-compatible path guard

  - script: |
      bash scripts/check_doc_freshness.sh
    displayName: Documentation freshness guard

  - script: |
      sudo apt-get update
      sudo apt-get install -y chromium-browser
      cd docs/diagrams && npm ci --no-audit --no-fund
      bash scripts/render_diagrams.sh --check
    displayName: Diagram asset freshness check

  - script: |
      if command -v quarto >/dev/null 2>&1; then
        quarto render docs/theory docs/usage --to html
      else
        echo "quarto not installed on agent; skipping book smoke"
      fi
    displayName: Quarto book smoke (theory + usage HTML)

  - script: |
      pytest scripts/tests/test_check_doc_freshness.py scripts/tests/test_render_diagrams.py -q
    displayName: Doc freshness and diagram script tests

  - script: |
      pytest scripts/tests/test_release_manifest.py -q
    displayName: Release script contract tests

  - script: |
      python scripts/check_no_step_config.py
      pytest workflow_engine/tests/test_no_step_config_in_projects.py -q
    displayName: Guard against step_config in project manifests

  - script: |
      if command -v terraform >/dev/null 2>&1; then
        terraform fmt -check -recursive deploy/terraform
        cd deploy/terraform/envs/dev && terraform init -backend=false && terraform validate
      else
        echo "terraform not installed on agent; skipping IaC validate"
      fi
    displayName: Terraform fmt and validate (no apply)

  - script: |
      python -m pip install -U pip build wheel
      bash scripts/build_release.sh \
        --version 0.0.0-ci \
        --output "$(Build.ArtifactStagingDirectory)/release-smoke" \
        --skip-wheels
    displayName: Runtime-bundle packaging smoke

  - script: |
      test -d "$(Build.ArtifactStagingDirectory)/release-smoke/runtime-bundle/scripts"
      test -f "$(Build.ArtifactStagingDirectory)/release-smoke/manifest.json"
      bash -n scripts/build_release.sh
      bash -n scripts/assemble_release.sh
      bash -n scripts/promote_release.sh
    displayName: Verify release layout
