# MethylPipeline PR validation — tests + release packaging smoke (no publish)
#
# Azure DevOps: New pipeline → this repo → /ci/azure-pipelines-pr.yml

trigger: none

pr:
  branches:
    include:
      - main
      - master
      - develop

pool:
  vmImage: ubuntu-latest

variables:
  PYTHON_VERSION: "3.12"

steps:
  - task: UsePythonVersion@0
    inputs:
      versionSpec: $(PYTHON_VERSION)

  - script: |
      python -m pip install -U pip pytest pytest-cov
    displayName: Install pytest

  - script: |
      bash scripts/check_doc_links.sh
    displayName: Documentation link guard

  - script: |
      python scripts/check_windows_paths.py
      pytest scripts/tests/test_check_windows_paths.py -q
    displayName: Windows-compatible path guard

  - script: |
      bash scripts/check_doc_freshness.sh
    displayName: Documentation freshness guard

  - script: |
      sudo apt-get update
      sudo apt-get install -y chromium-browser
      (cd docs/diagrams && npm ci --no-audit --no-fund)
      bash scripts/render_diagrams.sh --check
    displayName: Diagram asset freshness check

  - script: |
      bash scripts/install_quarto_ci.sh
      quarto render docs/theory docs/usage --to html
    displayName: Quarto book smoke (theory + usage HTML)

  - script: |
      python -m venv .venv
      . .venv/bin/activate
      python -m pip install -U pip
      bash scripts/install_packages.sh --with-deps
      methyl-export-action-catalog --check
      methyl-export-domain-schemas --check
    displayName: Schema and action catalog drift check

  - script: |
      pytest scripts/tests/test_check_doc_freshness.py scripts/tests/test_render_diagrams.py -q
    displayName: Doc freshness and diagram script tests

  - script: |
      pytest scripts/tests/test_release_manifest.py -q
    displayName: Release script contract tests

  - script: |
      python scripts/check_no_step_config.py
      pytest workflow_engine/tests/test_no_step_config_in_projects.py -q
    displayName: Guard against step_config in project manifests

  - script: |
      if command -v terraform >/dev/null 2>&1; then
        terraform fmt -check -recursive deploy/terraform
        cd deploy/terraform/envs/dev && terraform init -backend=false && terraform validate
      else
        echo "terraform not installed on agent; skipping IaC validate"
      fi
    displayName: Terraform fmt and validate (no apply)

  - script: |
      python -m pip install -U pip build wheel
      bash scripts/build_release.sh \
        --version 0.0.0-ci \
        --output "$(Build.ArtifactStagingDirectory)/release-smoke" \
        --skip-wheels
    displayName: Runtime-bundle packaging smoke

  - script: |
      test -d "$(Build.ArtifactStagingDirectory)/release-smoke/runtime-bundle/scripts"
      test -f "$(Build.ArtifactStagingDirectory)/release-smoke/manifest.json"
      bash -n scripts/build_release.sh
      bash -n scripts/assemble_release.sh
      bash -n scripts/promote_release.sh
    displayName: Verify release layout

  # --- Regression gate: full pytest suite + coverage (measure-and-report) ---
  # Runs the whole monorepo suite so changes cannot silently regress existing
  # behavior. GPU/DB/`/work`-fixture tests self-skip on the hosted agent.
  # Coverage is reported (no --cov-fail-under yet); see
  # docs/regulatory/continuous-integration-and-regression-testing.md.
  - script: |
      python -m venv .venv
      . .venv/bin/activate
      python -m pip install -U pip
      python -m pip install pytest pytest-cov
      bash scripts/install_packages.sh --with-deps
    displayName: Build test venv (editable packages + deps)

  - script: |
      bash scripts/run_tests_ci.sh
    displayName: Full pytest suite (regression) + coverage

  # --- Narrow, branch-aware coverage ratchet on the shared config-resolution ---
  # spine. Unlike the measure-and-report suite above, this enforces a real
  # fail_under on the small set of modules upstream of every typed action, where
  # a regression is high-blast-radius and invisible to the Pydantic boundary.
  - script: |
      . .venv/bin/activate
      bash scripts/run_spine_coverage_ratchet.sh
    displayName: Spine config-resolution coverage ratchet (branch, fail_under)

  - task: PublishTestResults@2
    condition: succeededOrFailed()
    inputs:
      testResultsFormat: JUnit
      testResultsFiles: test-results/junit.xml
      testRunTitle: MethylPipeline PR regression suite
      failTaskOnFailedTests: true
    displayName: Publish test results

  - task: PublishCodeCoverageResults@2
    condition: succeededOrFailed()
    inputs:
      summaryFileLocation: coverage/coverage.xml
      pathToSources: $(Build.SourcesDirectory)
    displayName: Publish code coverage
