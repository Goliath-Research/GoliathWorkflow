# Gated deploy: promote assembled release to /work/epimethyl (requires production-work environment approval).
# Run manually after assemble pipeline, or chain via pipeline completion trigger.

trigger: none

parameters:
  - name: releaseVersion
    displayName: Deploy bundle version (must match assemble artifact)
    type: string
  - name: pullParabricks
    displayName: docker pull Parabricks during promote (first arch only)
    type: boolean
    default: false
  - name: assemblePipelineName
    displayName: ADO pipeline name for release assemble
    type: string
    default: GoliathOmics-Release-Assemble
  - name: epimethylRoot
    displayName: Shared storage root on agent
    type: string
    default: /work/epimethyl
  - name: runE2eVerify
    displayName: Run verify_e2e_node.sh on deploy agent (GPU worker checks)
    type: boolean
    default: false

# Auto-trigger after successful assemble (set assemble pipeline name in ADO):
resources:
  pipelines:
    - pipeline: release_assemble
      source: GoliathOmics-Release-Assemble
      trigger:
        branches:
          include:
            - main

stages:
  - stage: Deploy
    displayName: Promote to shared storage
    jobs:
      - deployment: PromoteWork
        displayName: Promote release on /work
        environment: production-work
        pool:
          name: production-work-agents
        strategy:
          runOnce:
            deploy:
              steps:
                - checkout: none

                - task: DownloadPipelineArtifact@2
                  displayName: Download epimethyl release bundle
                  inputs:
                    buildType: specific
                    project: $(System.TeamProject)
                    definition: ${{ parameters.assemblePipelineName }}
                    buildVersionToDownload: latest
                    artifactName: goliathomics-release-${{ parameters.releaseVersion }}
                    targetPath: $(Pipeline.Workspace)/bundle

                - bash: |
                    set -euo pipefail
                    ROOT="${{ parameters.epimethylRoot }}"
                    VERSION="${{ parameters.releaseVersion }}"
                    RELEASE="$ROOT/releases/$VERSION"
                    mkdir -p "$RELEASE"
                    rsync -rl --delete --no-perms --no-owner --no-group \
                      "$(Pipeline.Workspace)/bundle/" "$RELEASE/"
                    PROMOTE="$RELEASE/runtime-bundle/scripts/promote_release.sh"
                    [[ -x "$PROMOTE" ]] || { echo "Missing promote script: $PROMOTE"; exit 1; }
                    PB_FLAG=(--skip-docker-pull)
                    if [[ "${{ parameters.pullParabricks }}" == "True" ]]; then
                      PB_FLAG=(--pull-parabricks)
                    fi
                    bash "$PROMOTE" --root "$ROOT" --release "$RELEASE" --arch aarch64 "${PB_FLAG[@]}"
                    bash "$PROMOTE" --root "$ROOT" --release "$RELEASE" --arch amd64 --skip-docker-pull
                    echo "Promoted $VERSION -> $ROOT/current"
                  displayName: Rsync bundle and promote_release (aarch64 + amd64)

                - bash: |
                    set -euo pipefail
                    RUNTIME="${{ parameters.epimethylRoot }}/current/runtime-bundle"
                    if [[ ! -x "$RUNTIME/scripts/verify_setup.sh" ]]; then
                      echo "Missing verify_setup.sh under $RUNTIME"
                      exit 1
                    fi
                    bash "$RUNTIME/scripts/verify_setup.sh"
                    if [[ -x "$RUNTIME/scripts/verify_e2e_node.sh" && "${{ parameters.runE2eVerify }}" == "True" ]]; then
                      bash "$RUNTIME/scripts/verify_e2e_node.sh"
                    fi
                    echo "Deploy verification passed for ${{ parameters.releaseVersion }}"
                  displayName: Post-promote verification
