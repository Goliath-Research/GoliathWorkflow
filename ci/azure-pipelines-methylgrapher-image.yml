# Build + publish methylGrapher(+vg) worker image (once per pin change).
#
# Deployments do NOT compile vg — they pull/load the published image via
# scripts/ensure_methylgrapher_image.sh and METHYL_METHYLGRAPHER_IMAGE.
#
# Azure DevOps: New pipeline → MethylPipeline-MethylGrapher-Image
#   → /ci/azure-pipelines-methylgrapher-image.yml
# Pool: self-hosted build-arm64 (same as MethylExtractor ARM64 release).
#
# Triggers: manual, or when the image Dockerfile / build script changes.
# Optional: set service connection + registry to docker push instead of tar artifact.

trigger:
  branches:
    include:
      - main
  paths:
    include:
      - workers/docker/methylgrapher/**
      - scripts/build_methylgrapher_image.sh
      - ci/azure-pipelines-methylgrapher-image.yml

pr: none

parameters:
  - name: vgVersion
    displayName: vg version pin
    type: string
    default: '1.70.0'
  - name: methylgrapherVersion
    displayName: methylGrapher PyPI version pin
    type: string
    default: '0.2.0'
  - name: imageRepository
    displayName: Image repository (no tag)
    type: string
    default: 'epimethyl/methylgrapher'
  - name: pushToRegistry
    displayName: docker push (requires containerRegistry service connection)
    type: boolean
    default: false
  - name: containerRegistry
    displayName: ADO Docker registry service connection (when pushToRegistry)
    type: string
    default: ''

variables:
  imageTag: ${{ parameters.vgVersion }}
  imageRef: ${{ parameters.imageRepository }}:${{ parameters.vgVersion }}

pool:
  name: build-arm64

steps:
  - checkout: self
    persistCredentials: true

  - bash: |
      set -euo pipefail
      sudo apt-get update -qq
      sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq docker.io || true
      sudo usermod -aG docker "$(id -un)" || true
      docker version
    displayName: Ensure Docker on agent

  - bash: |
      set -euo pipefail
      export VG_VERSION='${{ parameters.vgVersion }}'
      export METHYLGRAPHER_VERSION='${{ parameters.methylgrapherVersion }}'
      export METHYL_METHYLGRAPHER_IMAGE='$(imageRef)'
      export METHYLGRAPHER_IMAGE_TAR="$(Build.ArtifactStagingDirectory)/methylgrapher-$(imageTag)-arm64.tar.gz"
      export SKIP_SMOKE=1
      export INSTALL_DEPS=1
      export VG_SRC_DIR="$(Pipeline.Workspace)/vg-src/vg"
      chmod +x scripts/build_methylgrapher_image.sh
      ./scripts/build_methylgrapher_image.sh
      echo "##vso[task.setvariable variable=imageTar]$METHYLGRAPHER_IMAGE_TAR"
      docker image inspect "$(imageRef)" >/dev/null
    displayName: Build vg (jemalloc=off) + methylGrapher image

  - task: PublishPipelineArtifact@1
    displayName: Publish docker-save tarball artifact
    inputs:
      targetPath: $(Build.ArtifactStagingDirectory)
      artifact: methylgrapher-image-arm64

  - ${{ if eq(parameters.pushToRegistry, true) }}:
    - task: Docker@2
      displayName: Login + push image
      inputs:
        containerRegistry: ${{ parameters.containerRegistry }}
        repository: ${{ parameters.imageRepository }}
        command: push
        tags: |
          ${{ parameters.vgVersion }}
