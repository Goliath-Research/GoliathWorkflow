# In-site broken links fail --strict. Repo-outside / excluded-tree citations are
# softened to code spans by docs_hooks/soften_repo_links.py (see also
# scripts/check_doc_links.sh for filesystem checks).
not_in_nav: |
  architecture/documentation-audit*.md
  architecture/integrity-and-design-review*.md
  architecture/worker-security-review.md
  architecture/worker-transport-decision.md
  deployment/buffy_gene_tier_a_cross_vm.md
  deployment/hpca_ecdf_extval10_other_vm.md
  deployment/multicloud-iac.md
  deployment/work_layout_migration.md
  reference/ci-sync-matrix.md
  reference/test-data-registry.md
  reference/mojo-fq2bam-meth-parity.md

validation:
  nav:
    omitted_files: warn
  links:
    not_found: warn
    absolute_links: ignore
    unrecognized_links: ignore
    anchors: warn

watch:
  - docs
  - mkdocs.yml

