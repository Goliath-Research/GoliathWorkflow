# MethylPipeline documentation site (Markdown-first).
# Build:  source .venv/bin/activate && mkdocs build --strict
# Serve:  mkdocs serve
# PDF:    MKDOCS_EXPORTER_PDF_ENABLED=true mkdocs build

site_name: MethylPipeline Documentation
site_description: Theory, usage, architecture, deployment, and regulatory controls
site_url: ""
repo_url: https://github.com/Goliath-Research/MethylPipeline
edit_uri: ""

docs_dir: docs
site_dir: site

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: teal
      accent: teal
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: teal
      accent: teal
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.top
    - navigation.indexes
    - search.suggest
    - search.highlight
    - content.code.copy
    - toc.follow
  icon:
    logo: material/dna

hooks:
  - docs_hooks/filter_static.py
  - docs_hooks/soften_repo_links.py

plugins:
  - search
  # PDF export is enabled via mkdocs.pdf.yml (Playwright + mkdocs-exporter).

markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true

extra_javascript:
  - javascripts/mathjax.js
  - https://unpkg.com/mathjax@3/es5/tex-mml-chtml.js

extra_css:
  - stylesheets/extra.css

exclude_docs: |
  /plans/
  /research/
  /presentations/
  /canvas/**/*.canvas.tsx
  /canvas/**/*.canvas.data.json
  /canvas/tsconfig.json
  /diagrams/
  /user-manual/
  /docs/
  /diagnostics/
  /examples/
  **/_book/
  **/*_files/
  /MethylPipeline-analysis_files/
  /MethylPipeline-overview_files/
  **/*.qmd
  **/*.html
  **/*.pdf
  **/*.tex
  **/*.bib
  /architecture_review.md
  /config_parameter_matrix.md
  /domain_program_language.md
  /code_first_discovery_report.md
  /theory/chapters/13-configuration-reference.md
  /theory/chapters/14-user-guide.md
  /theory/README.md
  /usage/pdf-table-fix.tex
  /implementation/packages/_TEMPLATE.md

