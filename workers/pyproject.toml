[project]
name = "methyl-worker"
version = "1.0.0"
description = "REST workflow worker for MethylPipeline middle-tier"
readme = "WORKER_PROTOCOL.md"
requires-python = ">=3.10,<3.13"
dependencies = [
  "pydantic>=2.6.0,<3.0.0",
  "boto3>=1.34.0",
  "azure-identity>=1.15.0",
  "azure-storage-blob>=12.19.0",
]

[project.scripts]
methyl-worker = "methyl_worker.__main__:main"
methyl-export-task-schemas = "methyl_worker.task_schema_export:main"
methyl-export-action-catalog = "methyl_worker.action_catalog_export:main"
methyl-parabricks-align = "methyl_worker.parabricks_runner:main"
methyl-extract = "methyl_worker.extract_runner:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["methyl_worker*"]
