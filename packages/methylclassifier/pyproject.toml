[tool.poetry]
name = "methylclassifier"
version = "0.1.0"
description = "Command Line Tool for Methylation-Based Sample Classification"
authors = ["MethylClassifier Development Team"]
readme = "README.md"
packages = [{include = "methylclassifier"}]

[tool.poetry.dependencies]
python = ">=3.10,<3.13"
numpy = ">=1.19.0,<1.28.0"
scipy = ">=1.7.0,<1.12.0"
pandas = ">=1.3.0,<3.0.0"
h5py = ">=3.1.0,<4.0.0"
matplotlib = ">=3.3.0"
seaborn = ">=0.11.0"

[tool.poetry.scripts]
methylclassifier = "methylclassifier.cli:main"

[tool.poetry.dev-dependencies]
pytest = "^7.0.0"
pytest-cov = "^4.0.0"
black = "^23.0.0"
flake8 = "^6.0.0"
mypy = "^1.0.0"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

