[tool.poetry]
name = "methylmapper"
version = "0.1.0"
description = "DMP-to-gene mapping tool using Azure SQL Database and STRING-DB"
authors = ["MethylDetector Team"]
readme = "README.md"
packages = [{include = "methylmapper"}]

[tool.poetry.dependencies]
python = ">=3.10,<3.13"
sqlalchemy = ">=1.4.0"
pandas = ">=1.3.0,<3.0.0"
numpy = ">=1.20.0,<1.28.0"
pydantic = "^2.0.0"
pyodbc = ">=4.0.0"

[tool.poetry.scripts]
methylmapper = "methylmapper.cli:main"

[tool.poetry.dev-dependencies]
pytest = "^7.0.0"
pytest-cov = "^4.0.0"
black = "^23.0.0"
flake8 = "^6.0.0"
mypy = "^1.0.0"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

