[tool.poetry]
name = "methyl_mapper"
version = "0.1.0"
description = "DMP-to-gene mapping tool using Azure SQL Database and STRING-DB"
authors = ["MethylDetector Team"]
readme = "README.md"
packages = [{include = "methyl_mapper"}]

[tool.poetry.dependencies]
python = ">=3.10,<3.13"
sqlalchemy = ">=1.4.0,<3.0.0"
pandas = ">=2.1.0,<3.0.0"
numpy = ">=1.26.0,<3.0.0"
pydantic = ">=2.6.0,<3.0.0"
pyodbc = ">=4.0.0"
requests = ">=2.25.0"
cryptography = ">=3.4.0"
methylutils = {path = "../methylutils", develop = true}

[tool.poetry.scripts]
methyl-mapper = "methyl_mapper.cli:main"
methyl_mapper = "methyl_mapper.cli:main"
methyl_mapper_bedtools = "methyl_mapper.cli:main_bedtools"
methyl_mapper_credentials = "methyl_mapper.cli:main_credentials"

[tool.poetry.dev-dependencies]
pytest = "^7.0.0"
pytest-cov = "^4.0.0"
black = "^23.0.0"
flake8 = "^6.0.0"
mypy = "^1.0.0"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

