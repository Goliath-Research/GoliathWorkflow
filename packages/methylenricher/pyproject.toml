[tool.poetry]
name = "methyl_enricher"
version = "0.1.0"
description = "Gene enrichment analysis tool for methylation DMPs"
authors = ["MethylDetector Team"]
readme = "README.md"
packages = [{include = "methyl_enricher"}]

[tool.poetry.dependencies]
python = ">=3.10,<3.13"
gseapy = ">=1.1.0"
pandas = ">=2.1.0,<3.0.0"
numpy = ">=1.26.0,<3.0.0"
methylutils = {path = "../methylutils", develop = true}

[tool.poetry.scripts]
methyl_enricher = "methyl_enricher.cli:main"

[tool.poetry.dev-dependencies]
pytest = "^7.0.0"
pytest-cov = "^4.0.0"
black = "^23.0.0"
flake8 = "^6.0.0"
mypy = "^1.0.0"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

