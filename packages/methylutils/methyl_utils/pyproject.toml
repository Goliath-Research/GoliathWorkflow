[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "methyl-utils"
version = "1.0.0"
description = "Shared utilities for methyl-related applications (GPU detection, logging, etc.)"
authors = [
    {name = "MethylCentroid Team"}
]
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.8"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dependencies = [
    "numpy>=1.20.0",
    "nvidia-ml-py>=12.535.0",
    "pysam>=0.16.0",
]

[project.optional-dependencies]
gpu = [
    "cupy-cuda11x>=10.0.0",
]
rapids = [
    "cupy-cuda11x>=10.0.0",
    "cudf-cu11>=22.0.0",
]
dev = [
    "pytest>=6.0.0",
    "pytest-cov>=2.0.0",
]

[project.urls]
Homepage = "https://github.com/your-org/shared-gpu-utils"
Repository = "https://github.com/your-org/shared-gpu-utils"
Issues = "https://github.com/your-org/shared-gpu-utils/issues"

[project.scripts]
chrom-mapping = "methyl_utils.chrom_mapping:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["methyl_utils*"]
