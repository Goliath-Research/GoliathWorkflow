[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "methylutils"
version = "1.0.0"
description = "Genome-scale methylation analysis toolkit optimized for NVIDIA GH200"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [
    {name = "MethylUtils Team", email = "team@methylutils.org"},
]
maintainers = [
    {name = "MethylUtils Team", email = "team@methylutils.org"},
]
keywords = ["methylation", "genomics", "bioinformatics", "gpu", "cuda", "nvidia", "gh200"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Topic :: System :: Distributed Computing",
]
dependencies = [
    "numpy>=1.24.0,<1.25.0",
    "scipy>=1.11.0,<1.12.0",
    "pandas>=2.0.0,<2.1.0",
    "pydantic>=2.0.0,<2.1.0",
    "pyyaml>=6.0.0,<6.1.0",
    "colorlog>=6.7.0,<6.8.0",
]

[project.urls]
Homepage = "https://github.com/methylutils/methylutils"
Documentation = "https://methylutils.readthedocs.io/"
Repository = "https://github.com/methylutils/methylutils"
Issues = "https://github.com/methylutils/methylutils/issues"
Changelog = "https://github.com/methylutils/methylutils/blob/main/CHANGELOG.md"

[project.scripts]
methylutils = "methyl_utils.cli:main"
methylutils-deploy = "methyl_utils.deployment:main"

[project.optional-dependencies]
gpu = [
    "cupy-cuda12x>=12.1.0,<12.2.0",
    "cupyx>=12.1.0,<12.2.0",
    "torch>=2.0.0,<2.1.0",
    "torchvision>=0.15.0,<0.16.0",
    "torchaudio>=2.0.0,<2.1.0",
]
hdf5 = [
    "h5py>=3.9.0,<3.10.0",
    "hdf5plugin>=4.1.0,<4.2.0",
]
monitoring = [
    "prometheus-client>=0.17.0,<0.18.0",
    "psutil>=5.9.0,<5.10.0",
    "py-cpuinfo>=9.0.0,<9.1.0",
    "GPUtil>=1.4.0,<1.5.0",
    "memory-profiler>=0.61.0,<0.62.0",
    "line-profiler>=4.1.0,<4.2.0",
]
jupyter = [
    "jupyterlab>=4.0.0,<4.1.0",
    "ipywidgets>=8.0.0,<8.1.0",
]
datascience = [
    "scikit-learn>=1.3.0,<1.4.0",
    "matplotlib>=3.7.0,<3.8.0",
    "seaborn>=0.12.0,<0.13.0",
    "plotly>=5.15.0,<5.16.0",
]
development = [
    "pytest>=7.4.0,<7.5.0",
    "pytest-cov>=4.1.0,<4.2.0",
    "pytest-xdist>=3.3.0,<3.4.0",
    "pytest-benchmark>=4.0.0,<4.1.0",
    "black>=23.7.0,<23.8.0",
    "flake8>=6.0.0,<6.1.0",
    "mypy>=1.5.0,<1.6.0",
    "pre-commit>=3.4.0,<3.5.0",
    "sphinx>=7.0.0,<7.1.0",
    "sphinx-rtd-theme>=1.2.0,<1.3.0",
]
all = [
    "methylutils[gpu,hdf5,monitoring,jupyter,datascience,development]",
]
production = [
    "methylutils[gpu,hdf5,monitoring]",
]

[tool.setuptools]
zip-safe = false
include-package-data = true

[tool.setuptools.packages.find]
exclude = ["tests", "docs", "examples"]

[tool.setuptools.package-data]
methyl_utils = ["*.pyi", "py.typed"]
