[tool.poetry]
name = "methylcentroid"
version = "1.0.0"
description = "Methylation Centroid Calculation"
authors = ["David Izada Rodriguez <dizada@epimethyl.com>"]
readme = "README.md"
packages = [{include = "methyl_centroid"}]

[tool.poetry.dependencies]
python = ">=3.10,<3.13"
h5py = ">=3.10.0,<4.0.0"
numpy = ">=1.26.0,<3.0.0"
scipy = ">=1.11.0,<2.0.0"
hdf5plugin = ">=5.0.0,<7.0.0"
pysam = "*"
pandas = ">=2.1.0,<3.0.0"
statsmodels = ">=0.14.0,<1.0.0"
seaborn = ">=0.13.0,<0.14.0"
pydantic = ">=2.6.0,<3.0.0"
tqdm = ">=4.67.1,<5.0.0"
methylutils = {path = "../methylutils", develop = true}
psutil = ">=5.9.0"
plotly = ">=5.18.0,<7.0.0"

[tool.poetry.dev-dependencies]
pytest = "^7.0.0"
pytest-cov = "^4.0.0"
black = "^23.0.0"
flake8 = "^6.0.0"
mypy = "^1.0.0"
pre-commit = "^3.0.0"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
