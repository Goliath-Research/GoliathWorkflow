[build-system]
requires = ["setuptools>=45", "wheel", "setuptools_scm[toml]>=6.2"]
build-backend = "setuptools.build_meta"

[project]
name = "methylcluster"
version = "1.0.0"
description = "HDBSCAN clustering for methylation samples with GPU acceleration"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "David Izada Rodriguez", email = "dizada@epimethyl.com"}
]
keywords = ["bioinformatics", "methylation", "clustering", "HDBSCAN", "GPU"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    "numpy>=1.21.0",
    "scipy>=1.7.0",
    "h5py>=3.7.0",
    "hdf5plugin>=0.2.0",
    "hdbscan>=0.8.33",
    "scikit-learn>=1.0.0",
    "plotly>=5.0.0",
    "matplotlib>=3.5.0",
    "pydantic>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=3.0.0",
    "black>=22.0.0",
    "flake8>=4.0.0",
    "mypy>=0.950",
]

[project.scripts]
methylcluster = "methylcluster.cli:main"

[project.urls]
Homepage = "https://github.com/epimethyl/MethylPipeline"
Documentation = "https://github.com/epimethyl/MethylPipeline/tree/main/packages/methylcluster"
Repository = "https://github.com/epimethyl/MethylPipeline"
Issues = "https://github.com/epimethyl/MethylPipeline/issues"

[tool.setuptools]
packages = ["methylcluster"]

[tool.setuptools.package-data]
methylcluster = ["py.typed"]

[tool.black]
line-length = 100
target-version = ['py310', 'py311', 'py312']

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false

