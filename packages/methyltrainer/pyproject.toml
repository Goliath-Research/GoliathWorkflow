[tool.poetry]
name = "methyltrainer"
version = "0.1.0"
description = "Train Bayesian classifiers from methylation centroids"
authors = ["MethylAnalysis Team"]
readme = "README.md"
packages = [{include = "methyltrainer"}]

[tool.poetry.dependencies]
python = ">=3.10,<3.13"
numpy = ">=1.20.0,<1.28.0"
scipy = ">=1.7.0,<1.12.0"
h5py = ">=3.0.0,<4.0.0"
methylutils = {path = "../methylutils", develop = true}

[tool.poetry.scripts]
methyltrainer = "methyltrainer.cli:main"

[tool.poetry.dev-dependencies]
pytest = "^7.0.0"
pytest-cov = "^4.0.0"
black = "^23.0.0"
flake8 = "^6.0.0"
mypy = "^1.0.0"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

