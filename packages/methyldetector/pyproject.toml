[tool.poetry]
name = "methyl-detector"
version = "0.2.0"
description = "A genomics DMP detection tool using enhanced centroid-based comparison with FDR correction"
authors = ["Your Name <your.email@example.com>"]
readme = "README.md"
packages = [{include = "methyl_detector"}]

[tool.poetry.dependencies]
python = "^3.10"
pydantic = "^2.6.0"
numpy = "^1.26.0"
pandas = "^2.2.0"
scikit-learn = "^1.4.0"
matplotlib = "^3.8.0"
plotly = "^5.18.0"
tqdm = "^4.66.0"
click = "^8.1.0"
pathlib = "^1.0.1"
# Note: MethylUtils should be available in PYTHONPATH or installed separately
# The container should have /home/ubuntu/MethylUtils in the Python path
methylutils = {path = "../methylutils", develop = true}
methyl-trainer = {path = "../methyltrainer", develop = true}

# RAPIDS dependencies for GPU acceleration (installed in base image)
# cudf = "^25.6.0"
# cuml = "^25.6.0"
# cupy-cuda12x = "^13.4.0"

# HDF5 support for genomics data
h5py = "^3.10.0"
seaborn = "^0.13.2"
hdf5plugin = "^5.1.0"

[tool.poetry.group.dev.dependencies]
pytest = "^8.0.0"
pytest-cov = "^4.1.0"
black = "^24.1.0"
isort = "^5.13.0"
flake8 = "^7.0.0"
mypy = "^1.8.0"

[tool.poetry.scripts]
methyl-detector = "methyl_detector.cli.main:main"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.black]
line-length = 88
target-version = ['py310']

[tool.isort]
profile = "black"
multi_line_output = 3

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true 