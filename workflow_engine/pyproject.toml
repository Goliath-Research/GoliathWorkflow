[project]
name = "methyl-gateway"
version = "1.0.0"
description = "MethylPipeline workflow REST gateway (Azure SQL and PostgreSQL)"
readme = "README.md"
requires-python = ">=3.10,<3.13"
dependencies = [
  "psycopg[binary,pool]>=3.1",
  "pyodbc>=5.0",
  "pydantic>=2.6.0,<3.0.0",
  "azure-identity>=1.15.0",
  "PyJWT[crypto]>=2.8",
  "uvicorn[standard]>=0.30",
  "httpx>=0.27",
]

[project.scripts]
methyl-gateway = "rest.gateway:main"
methyl-workflow-run = "local.runner:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["rest*", "local*", "ops*"]

[tool.setuptools.package-dir]
"" = "."
