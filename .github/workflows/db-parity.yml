name: DB parity

on:
  push:
    paths:
      - 'workflow_engine/**'
      - 'contracts/**'
      - 'workers/**'
      - 'scripts/check_task_input_config_boundary.py'
      - 'scripts/migrate_profile_action_config.py'
      - 'scripts/check_sql_deploy_twins.py'
      - 'workflow_engine/sql_mssql/deploy_azure.sh'
      - 'workflow_engine/sql_pg/deploy_azure.sh'
  pull_request:
    paths:
      - 'workflow_engine/**'
      - 'contracts/**'
      - 'workers/**'
      - 'scripts/check_task_input_config_boundary.py'
      - 'scripts/migrate_profile_action_config.py'
      - 'scripts/check_sql_deploy_twins.py'
      - 'workflow_engine/sql_mssql/deploy_azure.sh'
      - 'workflow_engine/sql_pg/deploy_azure.sh'

jobs:
  contract-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install PyYAML
        run: pip install pyyaml
      - name: Validate DB object contract lockstep
        run: python workflow_engine/contract/validate_contract.py
      - name: SQL deploy_azure.sh twins (mssql ↔ pg)
        run: python scripts/check_sql_deploy_twins.py
      - name: Inventory script smoke (offline --help)
        run: python scripts/db_schema_inventory.py --help

  gateway-unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install gateway package and pytest (pyodbc stubbed in tests)
        run: pip install -e 'workflow_engine/[dev]'
      - name: MSSQL JSON binding policy and gateway unit tests
        run: |
          python -m pytest workflow_engine/tests/test_mssql_json_binding_policy.py \
            workflow_engine/tests/test_mssql_batches.py \
            workflow_engine/tests/test_connection.py \
            workflow_engine/tests/test_asgi.py \
            workflow_engine/tests/test_gateway_auth.py \
            -q

  postgres-parity:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: methyl
          POSTGRES_DB: methylpipeline_parity
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v6
      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install gateway package (REST smoke)
        run: pip install -e workflow_engine/
      - name: Run PostgreSQL parity harness
        env:
          POSTGRES_HOST: localhost
          POSTGRES_PORT: 5432
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: methyl
          POSTGRES_DB: methylpipeline_parity
        run: python workflow_engine/tests/parity/run_parity.py

  worker-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install host CLIs (samtools)
        run: sudo apt-get update && sudo apt-get install -y samtools
      - name: Install worker stack and pytest
        run: |
          python -m pip install -U pip pytest
          # pip does not honor workers/[tool.uv.sources]; install local
          # packages from scripts/packages.list first (same as hosted PR CI).
          PYTHON_BIN=python bash scripts/install_packages.sh --with-deps
      - name: Worker unit tests and schema drift check
        run: |
          python -m pytest workers/tests/ -q
          methyl-export-task-schemas --check
          python scripts/check_task_input_config_boundary.py
