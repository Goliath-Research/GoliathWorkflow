services:
  gpu_env:
    build:
      context: .
      dockerfile: Dockerfile
    image: methylpipeline-gpu-env
    container_name: methylpipeline
    user: "999:999"  # ubuntu user
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    ipc: host
    ulimits:
      memlock:
        soft: -1
        hard: -1
      stack:
        soft: 67108864
        hard: 67108864
    volumes:
      - /home/ubuntu/MethylPipeline:/workspace
      - /home/ubuntu/working_dir:/home/ubuntu/working_dir
      - /home/ubuntu/Work:/home/ubuntu/Work
    stdin_open: true
    tty: true
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - CUDA_VISIBLE_DEVICES=0
      - PYTHONPATH=/workspace/packages/methylutils:/workspace/packages/methyldetector:/workspace/packages/methylcentroid:/workspace/packages/methylmapper:/workspace/packages/methyltrainer:/workspace/packages/methylclassifier:/workspace/packages/methylenricher
      - METHYL_UTILS_PATH=/workspace/packages/methylutils
      - CUPY_CACHE_DIR=/home/ubuntu/.cupy/kernel_cache
    shm_size: '16gb'
    command: sleep infinity
